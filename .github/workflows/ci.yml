name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This repository alone, against the published moodlia and moodle-core-cli in package-lock.json.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.0', '24']
        include:
          # The only native dependency is better-sqlite3; one arm64 job
          # confirms its prebuilt binary installs on Apple Silicon.
          - os: macos-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm rebuild better-sqlite3
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run pack:check
      - run: npm audit --audit-level=high

  # Integration with sibling sources: each uses the branch with this branch's name when it
  # exists, otherwise main, so coordinated changes are tested together.
  siblings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moodlia-sync
      - name: Resolve sibling refs
        id: refs
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          pick() {
            if git ls-remote --exit-code --heads "https://github.com/gafapa/$1.git" "$branch" >/dev/null 2>&1; then echo "$branch"; else echo main; fi
          }
          echo "core=$(pick moodle-core-cli)" >> "$GITHUB_OUTPUT"
          echo "moodlia=$(pick moodlia-cli)" >> "$GITHUB_OUTPUT"
          echo "moodle-core-cli@$(pick moodle-core-cli), moodlia-cli@$(pick moodlia-cli)"
      - uses: actions/checkout@v4
        with:
          repository: gafapa/moodle-core-cli
          ref: ${{ steps.refs.outputs.core }}
          path: moodle-core-cli
      - uses: actions/checkout@v4
        with:
          repository: gafapa/moodlia-cli
          ref: ${{ steps.refs.outputs.moodlia }}
          path: moodlia-cli
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Core from source
        working-directory: moodle-core-cli
        run: npm ci
      - name: Install MoodlIA from source against the Core checkout
        working-directory: moodlia-cli
        run: |
          npm pkg set dependencies.moodle-core-cli="file:../moodle-core-cli"
          npm install
      - name: Use the MoodlIA checkout
        working-directory: moodlia-sync
        run: |
          npm pkg set dependencies.moodlia="file:../moodlia-cli"
          npm install
          npm rebuild better-sqlite3
      - run: npm run check
        working-directory: moodlia-sync
